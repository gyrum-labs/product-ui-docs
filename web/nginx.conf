# nginx server config for the project's UI image.
#
# Lives at /etc/nginx/conf.d/default.conf inside the image. The
# top-level /etc/nginx/nginx.conf (worker_processes, events, http{})
# from the stock nginx:alpine image is left untouched.
#
# Two things this config has to get right:
#   1. SPA fallback — deep routes resolve to the SPA shell, not 404.
#   2. Cache headers — hashed asset bundles cache forever, index.html
#      never caches so deploys roll out atomically.

server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Standard hardening — strips the nginx version string from
    # Server: and error pages.
    server_tokens off;

    # version.txt is written at build time and used by deploy smoke
    # checks ("does the running container match the tag I just
    # pushed?"). Don't cache it — that would defeat the point.
    location = /version.txt {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # The SPA shell itself MUST NOT cache, or deploys lag behind the
    # registry until each user's browser expires their copy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # SPA fallback — any unknown path serves index.html so the
    # client-side router can take over.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
